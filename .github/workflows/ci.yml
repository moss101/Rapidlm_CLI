# Baseline PR/push CI: fmt, lint, test, schema fixtures, SDK typecheck/test.
# Toolchains/lockfiles are pinned (rust-toolchain.toml 1.97.1, Node 24.19.0,
# pnpm 11.20.0, Cargo.lock, pnpm-lock.yaml). This workflow never maps
# secrets.* — pull_request jobs must not receive signing or provider credentials.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_TOOLCHAIN: "1.97.1"
  NODE_VERSION: "24.19.0"
  PNPM_VERSION: "11.20.0"
  # Schema goldens must never rewrite in CI.
  UPDATE_SCHEMA_FIXTURES: "0"

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --no-self-update --component rustfmt --component clippy
          rustup override set "${RUST_TOOLCHAIN}"
          rustc --version
          cargo --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Every platform's test suite is a gate, Windows included (since
      # 2026-09-17: the suite's fixtures resolve `sh`/`echo`/`sleep` per host
      # through `crates/test-fixtures` — Git for Windows' usr/bin there — and
      # the POSIX-only tiers (PTY via `script(1)`, the host-restricted
      # sandbox) report typed unavailability with Windows-side contract
      # tests). A failing Windows test is a red commit like any other.
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast

      - name: Schema fixtures
        run: cargo test --locked -p protocol --test schema_fixtures

  sdk:
    name: sdk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install pinned Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          # v5 turns package-manager caching on by default and, reading
          # `packageManager: pnpm@…` from package.json, runs `pnpm` to prime
          # it — before the corepack step below has enabled pnpm. Off; the
          # pinned pnpm comes from corepack, as it always has.
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          pnpm --version

      - name: Install SDK workspace
        run: pnpm install --frozen-lockfile

      - name: Check generated SDK wire types
        run: pnpm generate:check

      - name: Typecheck SDK
        run: pnpm typecheck

      - name: Test SDK
        run: pnpm test
