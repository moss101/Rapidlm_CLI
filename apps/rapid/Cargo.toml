[package]
name = "rapid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "rapid"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
# regex: repo.search regex mode + repo.glob pattern matching (Claude parity).
regex = "1"
# base64/flate2: rich reads — image data URLs and FlateDecode PDF streams.
base64 = "0.22"
flate2 = "1"
# agent-runtime: canonical AgentExecutor + ContextController/ContextRetryPolicy
# recovery seam. The composition root is the host that owns live context.
agent-runtime = { path = "../../crates/agent-runtime" }
acp = { path = "../../crates/acp" }
# context-engine: single Context Fabric authority (compile + compact_packet)
# reused by the live-context recovery host.
context-engine = { path = "../../crates/context-engine" }
# process-supervisor + agent-pool: P7 process/monitor/trigger/resource-pool
# runtime subsystems composed by the HostRuntime.
process-supervisor = { path = "../../crates/process-supervisor" }
agent-pool = { path = "../../crates/agent-pool" }
scheduler = { path = "../../crates/scheduler" }
mcp = { path = "../../crates/mcp" }
security = { path = "../../crates/security" }
insights = { path = "../../crates/insights" }
knowledge = { path = "../../crates/knowledge" }
# capability-broker: Capability/Policy/Lease authority for tool dispatch.
capability-broker = { path = "../../crates/capability-broker" }
# computer-use: browser/desktop/mobile observation+action leaf systems.
computer-use = { path = "../../crates/computer-use" }
mobile-sim = { path = "../../crates/mobile-sim" }
# sandbox: tiered SandboxManager (host-restricted/container/gvisor) for
# shell_exec's non-macOS sandbox: true path — see newtask.md §1.1.
sandbox = { path = "../../crates/sandbox" }
# protocol: SessionId / ApiError / ErrorCode are the JSONL record and exit-code surface.
protocol = { path = "../../crates/protocol" }
# auth: credential handles (SecretRef/SecretValue) and the process-local
# InMemoryCredentialStore backing the router's fail-closed credential resolver.
auth = { path = "../../crates/auth" }
# llm-router: provider adapters (OpenAI-compatible / Anthropic) behind the
# LiveModelCall bridge; its transport speaks HTTP/1.1 over TCP or rustls TLS.
llm-router = { path = "../../crates/llm-router" }
# toml: MIT/Apache-2.0; Grok-style user model config document parsing.
toml = "0.8"
# event-ledger: ErasedEventEnvelope / EventKind are the kernel event inputs mapped
# onto JSONL records. event-ledger does not depend on this crate.
event-ledger = { path = "../../crates/event-ledger" }
# plugin-host: manifest parse/validate + extension trust catalog + hook specs.
# The plugins CLI drives those production APIs; trust decisions stay fail-closed.
plugin-host = { path = "../../crates/plugin-host" }
# kernel: in-process KernelClient, project trust, config load, and service graph.
# This crate is a composition root and does not own those domain rules.
kernel = { path = "../../crates/kernel" }
# workspace: GitWorktreeStore isolation backend, used for shadow-verified
# writes (materialize a candidate edit, run diagnostics, only then commit).
workspace = { path = "../../crates/workspace" }
sha2 = "0.10"
# process-signal: the canonical process-group isolate/terminate primitives
# shared with the supervisor and sandbox backends; eval subprocess
# supervision reuses them instead of hand-rolling setsid/kill.
process-signal = { path = "../../crates/process-signal" }
# tui: terminal lifecycle, reducer, and slash-command dispatch. Domain state
# stays in the kernel; this crate only projects and forwards commands.
tui = { path = "../../crates/tui" }
# crossterm: MIT. Production interactive input poll after TerminalGuard raw mode.
# The tui crate already uses this backend; tests inject a scripted source.
crossterm = "0.28"
# serde: MIT/Apache-2.0; JsonlRecord is a versioned stdout wire contract.
serde = { version = "1", features = ["derive"] }
# serde_json: MIT/Apache-2.0; compact one-object-per-line encoding.
# `raw_value` keeps ApiError field order inside `data` instead of sorting keys.
serde_json = { version = "1", features = ["raw_value"] }
# jsonschema: MIT. `--json-schema` structured-output validation. Default
# features pull in reqwest for remote $ref resolution — disabled: schemas here
# are always a fully-inline, caller-supplied document, never fetched over the
# network.
jsonschema = { version = "0.52.0", default-features = false }
# time: MIT/Apache-2.0; already resolved transitively (Cargo.lock), promoted
# to a direct dep for `--jsonl`'s RFC3339 `time` field. `formatting`-only:
# this crate only ever stamps "now", never parses a caller-supplied one.
time = { version = "0.3.55", default-features = false, features = ["formatting"] }
