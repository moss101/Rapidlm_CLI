[package]
name = "acp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# serde: MIT/Apache-2.0; JSON-RPC 2.0 envelope encode/decode.
serde = { version = "1", features = ["derive"] }
# serde_json: MIT/Apache-2.0; compact newline-delimited ACP frames.
serde_json = "1"
# protocol: SessionId/ProjectId/TraceId/ApiError at the kernel boundary.
protocol = { path = "../protocol" }
# event-ledger: EventKind and ErasedEventEnvelope are the mapping input.
event-ledger = { path = "../event-ledger" }
# kernel: ACP is a frontend adapter over KernelClient; it does not own sessions.
kernel = { path = "../kernel" }
