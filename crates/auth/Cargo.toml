[package]
name = "auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# protocol: WorkerId/ControllerId are the canonical remote-worker identities
# bound from mTLS certificate SANs (auth sits above protocol).
protocol = { path = "../protocol" }
# rustls-pki-types: MIT/Apache-2.0; CertificateDer/TrustAnchor/PEM without a
# TLS server. rustls-webpki requires 1.12+.
rustls-pki-types = "1.12"
# rustls-webpki: ISC/MIT/Apache-2.0; rustls path validation for configured CAs.
# ring backend avoids aws-lc-rs native build. No std X.509 verifier exists.
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# sha2: MIT/Apache-2.0, tiny, maintained. Challenge proofs are HMAC-SHA256 so
# the daemon token is never sent on the wire or logged. std has no SHA-256.
# Also used for leaf certificate fingerprints (pin comparison).
sha2 = "0.10"

[dev-dependencies]
# rcgen: MIT/Apache-2.0; generate local test CA/leaf fixtures only. No
# production/external CA material.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
serde_json = "1"
