[package]
name = "capability-broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# protocol: RepoPath is the v1 repo-relative path contract (RLM-01-foundation-013).
protocol = { path = "../protocol" }
# event-ledger: AuditEmitter appends tool/approval events (RLM-02-kernel-ledger-005).
event-ledger = { path = "../event-ledger" }
# serde: MIT/Apache-2.0; versioned capability/resource wire objects.
serde = { version = "1", features = ["derive"] }
# serde_json: MIT/Apache-2.0; closed-schema decode so unknown fields/kinds fail.
serde_json = "1"
# toml: MIT/Apache-2.0; policy files are TOML. Same crate/version as kernel config.
toml = "0.8"
