[package]
name = "mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# protocol: ErrorCode / TraceId / JobId / ApiError for public mapping.
protocol = { path = "../protocol" }
# capability-broker: CancellationToken, NetConnect resource scopes, and
# NetworkIntent normalize used before any remote HTTP dial.
capability-broker = { path = "../capability-broker" }
# security: EgressProxy is the executor-side net allow/deny (RLM-07-012).
security = { path = "../security" }
# auth: remote MCP tokens stay SecretRef (RLM-01-010). No plaintext field.
auth = { path = "../auth" }
# serde_json: MIT/Apache-2.0; already a workspace protocol dep. JSON-RPC
# initialize frames only. Malformed/oversized input is Error, never a grant.
serde_json = "1"
