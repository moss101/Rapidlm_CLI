[package]
name = "scheduler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# protocol: GraphId / NodeId / SessionId wire identities.
protocol = { path = "../protocol" }
# event-ledger: durable append-before-apply for graph revisions.
event-ledger = { path = "../event-ledger" }
# agent-runtime: KEEP existing verified-orchestration supervisor; do not fork.
agent-runtime = { path = "../agent-runtime" }
# serde: MIT/Apache-2.0; graph proposal/snapshot wire objects.
serde = { version = "1", features = ["derive"] }
# serde_json: MIT/Apache-2.0; ledger payloads.
serde_json = "1"
