[package]
name = "security"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# auth: workspace SecretRef / ExposedSecret; redaction registers known secret bytes
# at the privileged injector boundary without exposing a plaintext getter.
auth = { path = "../auth" }
# capability-broker: NetworkIntent / trusted DNS normalize (RLM-03-004) and
# CancellationToken. Egress enforcement reuses that contract; no URL/IP fork.
capability-broker = { path = "../capability-broker" }
# acp: P12-024 fuzz target over the stdio JSON-RPC frame decoder boundary.
acp = { path = "../acp" }
# protocol: RepoPath / ArtifactId are the v1 location and evidence-ref contracts
# used by normalized scanner findings (RLM-07-sandbox-security-014).
protocol = { path = "../protocol" }
# sandbox: SandboxSpec / SandboxExecRequest are the supervised containment
# contract (RLM-07-sandbox-security-007). External scanners are untrusted
# executables and must run with least mounts and no network.
sandbox = { path = "../sandbox" }
# serde_json: MIT/Apache-2.0; already a workspace protocol dep. Used only to
# parse bounded SARIF 2.1.0 documents. Malformed input is Error, never Passed.
serde_json = "1"
# sha2: MIT/Apache-2.0, tiny, maintained. Fingerprints identify a redaction hit
# without logging plaintext. std has no SHA-256; DefaultHasher is not stable.
sha2 = "0.10"
