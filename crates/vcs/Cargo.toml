[package]
name = "vcs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# protocol: GoalId / EvidenceId / AgentId / WorkspaceViewId / ArtifactId / Id.
protocol = { path = "../protocol" }
# serde: MIT/Apache-2.0; versioned provenance-edge wire objects.
serde = { version = "1", features = ["derive"] }
# serde_json: MIT/Apache-2.0; closed-schema decode so unknown fields/kinds fail.
serde_json = "1"
